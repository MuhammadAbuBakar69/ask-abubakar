name: build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # rebuild the knowledge base daily so answers track the repositories
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test the retrieval engine
        run: npm test
      - name: rebuild the knowledge base from the GitHub API
        run: npm run kb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KB_LOGIN: MuhammadAbuBakar69
      - name: commit the refreshed knowledge base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kb.json
          git diff --staged --quiet || git commit -m "chore: refresh knowledge base [skip ci]"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
